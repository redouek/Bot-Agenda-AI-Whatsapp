services:
  bot:
    build: .
    ports:
      - "3000:3000"
    env_file: ./bot.env
    environment:
      NODE_ENV: production
      PORT: 3000
      CONFIG_PATH: /data/config.json
      DB_PATH: /data/app.sqlite
      SESSIONS_ROOT: /data/whatsapp-sessions
    volumes:
      - ./data:/data
    restart: unless-stopped
    shm_size: "1gb"
    # Node como PID 1 nao faz reap de filhos: processos do Chromium que sobram
    # viram zumbis e seguram RAM. O init do Docker recolhe.
    init: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: ./bot.env
    depends_on:
      - bot
